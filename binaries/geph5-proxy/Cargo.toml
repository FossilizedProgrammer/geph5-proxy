[package]
name = "geph5-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone Geph5 proxy client: signup, country selection, local SOCKS5/HTTP proxy (no system VPN)"

[dependencies]
anyctx = "0.1.1"
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = "3.5.2"
dirs = "5.0.1"
geph5-broker-protocol = { version = "0.4.3", path = "../../libraries/geph5-broker-protocol" }
geph5-client = { version = "0.4.3", path = "../geph5-client" }
geph5-misc-rpc = { version = "0.4.3", path = "../../libraries/geph5-misc-rpc" }
geph5-rt = { version = "0.3.8", path = "../../libraries/geph5-rt" }
hex = "0.4.3"
isocountry = "0.3.2"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["time", "macros"] }
